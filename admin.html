<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — DocuCraft</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><div class="admin-wrap"><header class="topbar"><div class="brand">✦ DocuCraft Admin</div><a href="/" class="btn small">Back to app</a></header><main><div class="section-head"><div><span class="eyebrow">ADMIN CONSOLE</span><h1>Overview</h1></div></div><div class="stats"><div><b id="users">—</b><span>Users</span></div><div><b id="docs">—</b><span>Documents</span></div></div><div class="card"><h3>Users</h3><div id="userTable">Loading…</div></div></main></div>
<script>
const SUPABASE_URL="YOUR_SUPABASE_URL",SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
async function load(){let {data:{session}}=await sb.auth.getSession();if(!session)return location.href="/";let h={Authorization:"Bearer "+session.access_token};let a=await fetch("/api/admin/stats",{headers:h});if(a.status===403)return document.body.innerHTML="<h2 style='padding:40px'>403 — Admin access required.</h2>";let stats=await a.json();document.querySelector("#users").textContent=stats.users;document.querySelector("#docs").textContent=stats.documents;let r=await fetch("/api/admin/users",{headers:h});let users=await r.json();document.querySelector("#userTable").innerHTML=users.map(u=>`<div class="user-row"><b>${u.email||"No email"}</b><span>${u.plan||"free"} · ${u.subscription_status||"inactive"}</span></div>`).join("")||"No users";}load();
</script></body></html>
