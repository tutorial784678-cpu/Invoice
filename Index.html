<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CV & Invoice Studio</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#687386;--line:#e5eaf1;--accent:#5b5ce2;--accent2:#7c3aed}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.app{min-height:100vh;background:var(--bg)}header{background:#101827;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-weight:800;font-size:20px}.brand span{color:#a5b4fc}.tabs{display:flex;gap:8px}.tabs button{border:0;background:#1e293b;color:#cbd5e1;padding:10px 16px;border-radius:10px;cursor:pointer}.tabs button.active{background:#6366f1;color:white}.wrap{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:420px 1fr;gap:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 25px #1720330d}.card h2{margin:0 0 15px;font-size:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px}input,textarea,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fff;color:var(--ink)}textarea{min-height:80px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#eef0ff;color:#4547c5}.dark{background:#172033;color:white}.preview{min-height:720px}.paper{background:white;border:1px solid #e5e7eb;box-shadow:0 10px 35px #11182712;min-height:700px;padding:42px;max-width:820px;margin:auto}.cv-head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #111827;padding-bottom:20px}.name{font-size:34px;font-weight:850}.role{color:#6366f1;font-weight:700;margin-top:5px}.section{margin-top:24px}.section h3{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;border-bottom:1px solid #ddd;padding-bottom:7px}.item{margin:12px 0}.item b{display:block}.muted{color:#6b7280;font-size:13px}.invoice-top{display:flex;justify-content:space-between;border-bottom:2px solid #111827;padding-bottom:18px}.invoice-title{font-size:40px;font-weight:900}.invoice-meta{text-align:right}.table{width:100%;border-collapse:collapse;margin-top:25px}.table th,.table td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}.table th:last-child,.table td:last-child{text-align:right}.totals{margin-left:auto;width:270px;margin-top:20px}.totals div{display:flex;justify-content:space-between;padding:7px}.total{font-weight:900;font-size:18px;border-top:2px solid #111827;margin-top:5px}.hint{font-size:12px;color:var(--muted);margin-top:8px}@media(max-width:850px){.grid{grid-template-columns:1fr}.paper{padding:25px}.wrap{padding:14px}.cv-head{flex-direction:column}.tabs button{padding:8px 10px}.name{font-size:28px}}@media print{header,.editor,.actions,.hint{display:none!important}.wrap{padding:0}.grid{display:block}.preview{display:block}.paper{box-shadow:none;border:0;max-width:none}.app{background:white}}
</style></head><body><div class='app'><header><div class='brand'>CV & <span>Invoice</span> Studio</div><div class='tabs'><button id='cvTab' class='active' onclick='showMode("cv")'>CV Builder</button><button id='invTab' onclick='showMode("invoice")'>Invoice</button></div></header><main class='wrap'><div class='grid'><section class='card editor' id='editor'></section><section class='card preview'><div id='preview'></div></section></div></main></div><script>
let mode='cv', items=[{desc:'Professional service',qty:1,price:0}];
const cvDefault={name:'Your Name',role:'Professional Title',email:'you@example.com',phone:'+92 300 0000000',city:'Islamabad, Pakistan',summary:'A short professional summary about your experience, strengths and career goals.',experience:'Job Title — Company\n2024 – Present\nDescribe your responsibilities and achievements.',education:'Degree — Institution\n2020 – 2024',skills:'Communication, Leadership, Microsoft Office, Problem Solving'};
const invDefault={business:'Your Business',client:'Client Name',number:'INV-001',date:new Date().toISOString().slice(0,10),tax:0,notes:'Thank you for your business.'};
let cv={...cvDefault},inv={...invDefault};
function showMode(m){mode=m;cvTab.classList.toggle('active',m==='cv');invTab.classList.toggle('active',m==='invoice');renderEditor();renderPreview()}
function field(k,label,val,full=false,area=false){return `<div class='${full?'full':''}'><label>${label}</label>${area?`<textarea oninput='${mode}["${k}"]=this.value;renderPreview()'>${val}</textarea>`:`<input value='${esc(val)}' oninput='${mode}["${k}"]=this.value;renderPreview()'>`}</div>`}
function renderEditor(){if(mode==='cv'){editor.innerHTML=`<h2>Build your CV</h2><div class='formgrid'>${field('name','Full name',cv.name)}${field('role','Professional title',cv.role)}${field('email','Email',cv.email)}${field('phone','Phone',cv.phone)}${field('city','Location',cv.city)}${field('skills','Skills',cv.skills)}${field('summary','Professional summary',cv.summary,true,true)}${field('experience','Experience',cv.experience,true,true)}${field('education','Education',cv.education,true,true)}</div><div class='actions'><button class='btn primary' onclick='window.print()'>Download / Print PDF</button><button class='btn secondary' onclick='resetAll()'>Reset</button></div><div class='hint'>Tip: choose “Save as PDF” in the print dialog.</div>`}else{editor.innerHTML=`<h2>Create an invoice</h2><div class='formgrid'>${field('business','Your business',inv.business)}${field('client','Bill to',inv.client)}${field('number','Invoice number',inv.number)}${field('date','Date',inv.date)}${field('tax','Tax %',inv.tax)}<div class='full'><label>Items</label><div id='itemsEditor'></div><button class='btn secondary' onclick='addItem()'>+ Add item</button></div>${field('notes','Notes',inv.notes,true,true)}</div><div class='actions'><button class='btn primary' onclick='window.print()'>Download / Print PDF</button><button class='btn secondary' onclick='resetAll()'>Reset</button></div>`;renderItemsEditor()}}
function renderItemsEditor(){itemsEditor.innerHTML=items.map((x,i)=>`<div style='display:grid;grid-template-columns:1.5fr .5fr .7fr auto;gap:6px;margin-bottom:7px'><input placeholder='Item' value='${esc(x.desc)}' oninput='items[${i}].desc=this.value;renderPreview()'><input type='number' min='0' value='${x.qty}' oninput='items[${i}].qty=this.value;renderPreview()'><input type='number' min='0' value='${x.price}' oninput='items[${i}].price=this.value;renderPreview()'><button class='btn' onclick='items.splice(${i},1);renderEditor();renderPreview()'>×</button></div>`).join('')}
function addItem(){items.push({desc:'New item',qty:1,price:0});renderItemsEditor();renderPreview()}
function renderPreview(){if(mode==='cv'){preview.innerHTML=`<div class='paper'><div class='cv-head'><div><div class='name'>${esc(cv.name)}</div><div class='role'>${esc(cv.role)}</div></div><div class='muted'>${esc(cv.email)}<br>${esc(cv.phone)}<br>${esc(cv.city)}</div></div><div class='section'><h3>Profile</h3><p>${nl(cv.summary)}</p></div><div class='section'><h3>Experience</h3>${blocks(cv.experience)}</div><div class='section'><h3>Education</h3>${blocks(cv.education)}</div><div class='section'><h3>Skills</h3><p>${esc(cv.skills)}</p></div></div>`}else{let sub=items.reduce((a,x)=>a+(+x.qty||0)*(+x.price||0),0),tax=sub*(+inv.tax||0)/100,total=sub+tax;preview.innerHTML=`<div class='paper'><div class='invoice-top'><div><div class='invoice-title'>INVOICE</div><b>${esc(inv.business)}</b></div><div class='invoice-meta'><b>${esc(inv.number)}</b><br>${esc(inv.date)}<br><span class='muted'>Bill to: ${esc(inv.client)}</span></div></div><table class='table'><thead><tr><th>Description</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.desc)}</td><td>${x.qty}</td><td>Rs ${(+x.price||0).toFixed(2)}</td><td>Rs ${((+x.qty||0)*(+x.price||0)).toFixed(2)}</td></tr>`).join('')}</tbody></table><div class='totals'><div><span>Subtotal</span><b>Rs ${sub.toFixed(2)}</b></div><div><span>Tax (${inv.tax}%)</span><b>Rs ${tax.toFixed(2)}</b></div><div class='total'><span>Total</span><b>Rs ${total.toFixed(2)}</b></div></div><div class='section'><h3>Notes</h3><p>${nl(inv.notes)}</p></div></div>`}}
function blocks(s){return s.split(/\n(?=[^\n])/).map(x=>`<div class='item'>${nl(x)}</div>`).join('')}
function nl(s){return esc(s).replace(/\n/g,'<br>')};function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))};function resetAll(){cv={...cvDefault};inv={...invDefault};items=[{desc:'Professional service',qty:1,price:0}];renderEditor();renderPreview()};showMode('cv');
</script></body></html>
